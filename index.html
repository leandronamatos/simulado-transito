<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado de Trânsito</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}header{background:#153e75;color:#fff;padding:24px 16px}.wrap{max-width:760px;margin:auto}.card{background:#fff;margin:20px 12px;padding:22px;border-radius:16px;box-shadow:0 3px 16px #0001}h1{margin:0 0 6px;font-size:26px}h2{font-size:21px}.muted{color:#667085}button{width:100%;padding:14px;margin:7px 0;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px;text-align:left;cursor:pointer}.primary{background:#153e75;color:#fff;border:0;text-align:center;font-weight:bold}.ok{background:#e8f7ed!important;border-color:#36a15b!important}.bad{background:#fdeaea!important;border-color:#d84b4b!important}.progress{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar{height:100%;background:#153e75}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#e8f1ff;color:#153e75;font-weight:bold}.subject{font-weight:bold}.disabled{opacity:.5;cursor:not-allowed}#quiz,#result{display:none}.summary{padding:12px;background:#f8fafc;border-radius:12px;margin:12px 0}
</style></head><body>
<header><div class="wrap"><h1>Simulado de Trânsito</h1><div>Treinamento para reciclagem</div></div></header>
<main class="wrap">
<section id="home" class="card"><span class="tag">Escolha a matéria</span><h2>O que você quer estudar?</h2><p class="muted">Cada rodada terá até 15 questões. Ao final, você poderá refazer somente as que errou.</p><div id="classes"></div></section>
<section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="subject" class="tag"></p><p id="count" class="muted"></p><h2 id="question"></h2><div id="options"></div></section>
<section id="result" class="card"><span id="resultSubject" class="tag"></span><h2>Resultado da rodada</h2><div id="score" class="summary"></div><div id="overall" class="summary"></div><button id="retry" onclick="retryWrong()">Refazer somente as erradas</button><button id="next" class="primary" onclick="nextRound()">Próximas perguntas</button><button onclick="goHome()">Voltar às matérias</button></section>
</main>
<script>
const questions=[
{id:"PS101",c:"Primeiros Socorros",q:"Um motorista depara-se com um acidente ocasionado pela colisão de dois ônibus. No interior dos veículos encontram-se algumas vítimas queixando-se de fome, sede e dores musculares. Neste caso, a conduta correta do motorista é:",o:["oferecer, após rápida avaliação, bebidas quentes e analgésicos","não oferecer alimentos ou bebidas, até ordem contrária dos médicos socorristas","estimular que todos comam alimentos com sal para evitar queda da pressão arterial","oferecer, após rápida avaliação, apenas alimentos doces"],a:1},
{id:"DF25",c:"Direção Defensiva",q:"O condutor deve ficar atento aos sinais do veículo da frente, como luz de freio e indicador de direção (ou seta), pois eles refletem:",o:["a habilidade do motorista","o itinerário que o motorista vai seguir","o que o motorista pretende fazer","a serenidade do motorista"],a:2},
{id:"PS55",c:"Primeiros Socorros",q:"O que fazer, no local, com o acidentado que sofreu queimaduras?",o:["Passar pasta de dente na ferida.","Cobrir a ferida com um pano qualquer.","Lavar com água limpa ou soro fisiológico.","Dar leite para a pessoa tomar."],a:2},
{id:"LT50",c:"Legislação de Trânsito",q:"Você está em uma via secundária e vai entrar em uma rodovia de alta velocidade e com grande volume de tráfego. A forma mais adequada de efetuar essa manobra é:",o:["entrar na rodovia e, logo em seguida, se encaminhar para a faixa da esquerda","sinalizar, ganhar velocidade na pista de aceleração (se houver) ou no acostamento, de forma a entrar na pista já em velocidade compatível com a da rodovia","entrar em velocidade reduzida, conforme preceito da direção defensiva","entrar na faixa da direita da rodovia e, então, acelerar para ganhar velocidade"],a:1},
{id:"RI08",c:"Relacionamento Interpessoal / Convívio Social",q:"Para conviver socialmente no trânsito o que cada um deve fazer?",o:["sempre que achar conveniente exercer seus deveres","obedecer apenas a sinalização de trânsito","conhecer e exercer seus direitos e deveres para garantir a segurança em favor do bem comum","conhecer seus desejos e exercê-los com direito"],a:2},
{id:"RI20",c:"Relacionamento Interpessoal / Convívio Social",q:"Para melhorar o convívio e a qualidade de vida, existem alguns princípios que devem ser a base das nossas relações no trânsito, dentre eles, a dignidade da pessoa humana, que se caracteriza por:",o:["modificar o comportamento do condutor, colaborando para a diminuição dos riscos de acidente de trânsito","ser o princípio universal do qual derivam os Direitos Humanos e os valores e atitudes fundamentais para o convívio social democrático","considerar as diferenças das pessoas para garantir a igualdade, fundamentando a solidariedade","valorizar comportamentos necessários à segurança no trânsito e à efetivação do direito de mobilidade a todos os cidadãos"],a:1},
{id:"LT78",c:"Legislação de Trânsito",q:"Sobre o CTB não é correto afirmar:",o:["Entrou em vigor em 1997;","Aplica-se somente nas vias privadas do território nacional;","Regulamenta entre outros temas, regras de circulação, infrações e crimes de trânsito;","Pode ser alterado por resoluções do CONTRAN."],a:1},
{id:"DF81",c:"Direção Defensiva",q:"Assinale a opção incorreta sobre as regras de ultrapassagem:",o:["o condutor poderá ultrapassar mais de um veículo por vez, desde que esteja desenvolvendo velocidade maior do que a dos veículos que estão sendo ultrapassados;","o condutor deve ultrapassar somente em locais onde a visibilidade seja boa;","A ultrapassagem deve ser feita somente em locais permitidos pela sinalização e que proporcione segurança na manobra;","Ao ser ultrapassado, o condutor não deve aumentar a velocidade."],a:0},
{id:"LT02",c:"Legislação de Trânsito",q:"O auto de infração valerá como notificação da autuação quando:",o:["for assinado pelo condutor e este for o proprietário do veículo.","o proprietário for responsável juntamente com o condutor no cometimento da infração.","o condutor for autuado em flagrante.","não for expedida a notificação de autuação, no prazo de 30 dias."],a:0},
{id:"DF101",c:"Direção Defensiva",q:"A situação que caracteriza uma conduta segura no trânsito é:",o:["procurar uma faixa de pedestres e olhar para os dois lados, quando atravessar uma rua","atravessar em diagonal uma avenida com pouco movimento","atravessar um cruzamento quando o semáforo estiver mudando do amarelo para o vermelho","usar telefone celular com dispositivo viva-voz, enquanto estiver dirigindo"],a:0},
{id:"PS131",c:"Primeiros Socorros",q:"No caso de uma vítima de trânsito apresentar fogo nas roupas, um dos procedimentos correto é:",o:["iniciar o abafamento do fogo pelos pés até a cabeça","jogar água na roupa para tentar apagar o fogo","abafar as chamas utilizando-se de uma toalha ou cobertor","deitar a vítima no chão com o lado das chamas para baixo"],a:2},
{id:"DF24",c:"Direção Defensiva",q:"Um condutor está dirigindo seu veículo, quando percebe um motorista tentando ultrapassá-lo. Nesse momento, reduz a velocidade e aproxima seu veículo da borda direita da pista para facilitar a manobra do outro. Nesse caso, esse condutor agiu com:",o:["cortesia","reciprocidade","mutualidade","coesão"],a:0},
{id:"LT107",c:"Legislação de Trânsito",q:"NÃO é um documento de porte obrigatório:",o:["CRV – Certificado de Registro Veicular.","CNH – Carteira Nacional de Habilitação.","PPD – Permissão Para Dirigir.","ACC – Autorização para Conduzir Ciclomotor."],a:0},
{id:"LT85",c:"Legislação de Trânsito",q:"Teobaldo é um condutor de 55 anos de idade que renovará sua CNH em março de 2017. Qual a validade do novo documento?",o:["Março de 2022;","Março de 2021;","Março de 2023;","Março de 2020."],a:0},
{id:"RI34",c:"Relacionamento Interpessoal / Convívio Social",q:"Os direitos e deveres do cidadão são determinados por leis e códigos, como exemplo tem-se:",o:["a Constituição","o Código Civil","o Código de Trânsito","todas as alternativas estão corretas"],a:3},
{id:"PS35",c:"Primeiros Socorros",q:"Uma boa sequência no atendimento ou auxílio inicial em caso de acidente de trânsito é:",o:["garantir a segurança; pedir socorro; controlar a situação","pedir ajuda das pessoas; movimentar a vítima; acionar o socorro","localizar as vítimas; examinar as vítimas; proteger as vítimas","movimentar a vítima; conversar com a vítima; sinalizar o local"],a:0},
{id:"PS116",c:"Primeiros Socorros",q:"No caso de uma vítima de trânsito apresentar fogo nas roupas, um dos procedimentos correto é:",o:["iniciar o abafamento do fogo pelos pés até a cabeça","abafar as chamas utilizando-se de uma toalha ou cobertor","jogar água na roupa para tentar apagar o fogo","deitar a vítima no chão com o lado das chamas para baixo"],a:1},
{id:"PS123",c:"Primeiros Socorros",q:"A movimentação de uma vítima pode piorar uma lesão:",o:["na cabeça","na coluna","na visão","em uma hemorragia"],a:1},
{id:"PS13",c:"Primeiros Socorros",q:"Para identificar uma fratura, é necessário verificar:",o:["se o local da lesão está limpo","se há movimento respiratório","se há a pulsação arterial","se há dor, ausência de movimento e deformidade no local"],a:3},
{id:"PS129",c:"Primeiros Socorros",q:"Uma vítima de atropelamento pede ao condutor que está prestando socorro um analgésico para diminuir a dor de cabeça. Nesse caso, o condutor que está socorrendo deve:",o:["providenciar atendimento médico e não atender ao pedido da vítima","atender ao pedido da vítima para acalmá-la","atender ao pedido da vítima, já que está acostumada a tomar o remédio","atender ao pedido da vítima, levando-a à farmácia"],a:0},
{id:"DF17",c:"Direção Defensiva",q:"A aquaplanagem ocorre quando um lençol de água cobre a pista e o pneu perde aderência com o solo. Nessas condições de pista, para manter a aderência e a estabilidade, o condutor deve:",o:["frear rápido o veículo assim que sentir a perda de aderência","manter a mesma velocidade da pista seca","reduzir a velocidade e manter distância do veículo à frente","segurar firme o volante e acelerar o veículo"],a:2},
{id:"DF62",c:"Direção Defensiva",q:"Não é classificado como condição adversa:",o:["Tempo;","Via;","Veículo;","Manutenção."],a:3},
{id:"DF65",c:"Direção Defensiva",q:"O efeito que faz com que os pneus do veículo percam a aderência com o piso em função da camada de água e o excesso de velocidade é chamado de:",o:["Aquaplanagem;","Força centrífuga;","Desestabilização;","Condições adversas."],a:0},
{id:"DF19",c:"Direção Defensiva",q:"Em uma ultrapassagem, uma das principais variáveis básicas envolvidas é a:",o:["avaliação do risco a ser assumido durante a manobra","distância de conversão","declividade da via","distância de parada"],a:0},
{id:"DF39",c:"Direção Defensiva",q:"As recomendações a seguir são importantes instrumentos de direção defensiva e de educação no trânsito, à exceção de uma. Assinale-a.",o:["dê preferência de passagem aos veículos que se deslocam sobre trilhos, respeitadas as normas de circulação","ao dirigir um veículo de maior porte, tome todo o cuidado e seja responsável pela segurança dos veículos menores, pelos não motorizados e pela segurança dos pedestres","nos cruzamentos, não pare seu veículo bloqueando a passagem de outros veículos a menos que você esteja na via preferencial e com o semáforo ainda verde para você","só ultrapasse nos locais que a sinalização permita"],a:2},
{id:"DF53",c:"Direção Defensiva",q:"Carlos não tem o hábito de realizar periodicamente a manutenção preventiva em seu carro, o que é fundamental para minimizar o risco de acidentes de trânsito. Nessa situação, segundo os conceitos de Direção Defensiva, Carlos age com:",o:["imprudência","estupidez","negligência","imperícia"],a:2},
{id:"DF200",c:"Direção Defensiva",q:"Na possibilidade de um choque do veículo que você está dirigindo com o veículo que vai à frente, qual atitude seguir?",o:["Mudar de direção sem sinalizar.","Pisar no freio aos poucos reduzindo a velocidade do veículo.","Deixar acontecer.","Acionar o freio de mão."],a:1},
{id:"DF20",c:"Direção Defensiva",q:"Das alternativas abaixo, qual é a única que está INCORRETA:",o:["as bicicletas têm direito de trânsito como qualquer outro veículo","deve-se ter atenção especial à noite, pois muitos ciclistas não usam os dispositivos refletivos previstos em lei, dificultando visualizá-los","deve-se manter uma distância lateral mínima de 50 centímetros da bicicleta","a bicicleta é um veículo silencioso e que pode facilmente se posicionar em pontos cegos"],a:2},
{id:"DF104",c:"Direção Defensiva",q:"A Direção Defensiva é conceituada como o conjunto de técnicas que:",o:["evitam que o condutor seja multado","evitam que o condutor avance os sinais","devolvem os vinte pontos à Carteira Nacional de Habilitação do condutor","capacitam o condutor a dirigir evitando acidentes"],a:3},
{id:"DF47",c:"Direção Defensiva",q:"Desconhecendo o local de destino, o condutor deve",o:["seguir a intuição, quando for motorista experiente","enquanto dirige, cadastrar o destino no GPS","estudar previamente o trajeto a ser executado","parar o veículo na via para obter informação"],a:2},
{id:"DF72",c:"Direção Defensiva",q:"O que é distância de reação?",o:["É a distância que o veículo percorre a partir do momento em que o condutor percebe o perigo até reagir acionando os freios;","É a distância que o veículo percorre desde o momento em que o condutor vê o perigo até parar o veículo;","É a distância percorrida a partir do momento em que o condutor pisa no freio até a parada total do veículo;","É a distância que o veículo percorre enquanto está parando."],a:0},
{id:"DF61",c:"Direção Defensiva",q:"Dirigir defensivamente é:",o:["Dirigir de forma organizada, mantendo concentração constante para diminuir ao máximo os trajetos;","Dirigir de modo a evitar acidentes, apesar das ações incorretas de terceiros e das condições adversas no momento em que trafega;","Dirigir de uma forma que garanta segurança, conforto e economia, mesmo que as regras de preferência no cruzamento precisem ser ignoradas;","Dirigir de modo que o automatismo correto prevaleça, ainda que se necessite utilizar a atenção dispersiva."],a:1},
{id:"DF87",c:"Direção Defensiva",q:"As condições adversas são situações causadoras de acidentes. Qual a alternativa que contém todas estas situações:",o:["Vítima, luz, tempo, via trânsito, veículo e motorista;","Carga, luz, tempo, via trânsito, veículo, motorista de transportes de passageiros e emergência;","Luz, tempo, via, trânsito, veículo, motorista, passageiro e carga;","Vítima, luz, tempo, via trânsito, veículo e motorista de transporte de produtos perigosos."],a:2},
{id:"DF51",c:"Direção Defensiva",q:"A segurança na direção de um veículo, um dos princípios básicos da Direção Defensiva, depende:",o:["da especificação e da potência do veículo","do comportamento adequado do condutor e suas atitudes no trânsito","do trajeto e do trânsito na distância a ser percorrida","do licenciamento do veículo"],a:1},
{id:"LT65",c:"Legislação de Trânsito",q:"Para mudar da categoria B para categoria D o condutor precisa ser habilitado no mínimo há dois anos na categoria B. Além disso, qual a idade mínima exigida para mudança?",o:["20 anos;","19 anos;","18 anos","21 anos;"],a:3},
{id:"LT43",c:"Legislação de Trânsito",q:"O veículo \"A\" circula a 90 Km/h e o veículo \"B\" circula a 70 Km/h. Considerando que ambos circulam em uma via arterial, quem está desrespeitando a velocidade máxima permitida?",o:["o veículo A.","o veículo B.","os dois.","nenhum dos dois."],a:2},
{id:"LT30",c:"Legislação de Trânsito",q:"Para habilitar-se na categoria \"C\", o condutor deverá estar habilitado na categoria \"B\", no mínimo há:",o:["4 anos.","1 ano.","2 anos.","3 anos."],a:1},
{id:"LT22",c:"Legislação de Trânsito",q:"Um candidato à obtenção da CNH, aprovado nos exames, recebeu a Permissão para Dirigir. Ao final de um ano, tendo cometido uma infração de natureza grave, ele:",o:["receberá nova Permissão para Dirigir, válida por seis meses.","deverá reiniciar todo o procedimento de habilitação.","terá o direito de dirigir suspenso por mês, recebendo a CNH após este prazo.","receberá nova Permissão para Dirigir, válida por um ano."],a:1},
{id:"LT137",c:"Legislação de Trânsito",q:"Todo condutor, numa rodovia, ao perceber que outro veículo no sentido contrário iniciou uma ultrapassagem sem distância suficiente para realizar a manobra, deverá:",o:["aumentar a velocidade, buzinar e desviar do veículo que iniciou a ultrapassagem.","aumentar a velocidade, e se necessário, dirigir-se ao acostamento até que o outro veículo conclua a ultrapassagem.","reduzir a velocidade, e se necessário, dirigir-se ao acostamento até que o outro veículo conclua a ultrapassagem.","reduzir a velocidade e parar, para que o outro veículo conclua a ultrapassagem."],a:2},
{id:"LT134",c:"Legislação de Trânsito",q:"Tratando-se de automóveis, as velocidades máximas permitidas nas estradas e nas rodovias de pista dupla são, respectivamente:",o:["80 km/h - 110 km/h.","60 km/h - 110 km/h.","80 km/h - 80 km/h.","60 km/h - 80 km/h."],a:1},
{id:"LT61",c:"Legislação de Trânsito",q:"Qual a principal norma que regulamenta o trânsito no Brasil?",o:["Constituição Federal;","Código Penal e de Transporte;","Código de Trânsito Brasileiro;","Resoluções do DETRAN."],a:2},
{id:"LT110",c:"Legislação de Trânsito",q:"Mesmo com o sinal verde e, em caso de engarrafamento no cruzamento, o condutor NÃO deverá:",o:["avançar na faixa de pedestre.","respeitar a lei.","aguardar a sua vez de passar.","deixar o cruzamento livre."],a:0},
{id:"LT48",c:"Legislação de Trânsito",q:"NÃO é equipamento obrigatório para motocicletas:",o:["buzina.","dispositivo destinado ao controle de ruído do motor.","espelhos retrovisores de ambos os lados.","extintor de incêndio."],a:3}
];
const classOrder=["Primeiros Socorros","Direção Defensiva","Legislação de Trânsito","Relacionamento Interpessoal / Convívio Social","Meio Ambiente","Funcionamento do Veículo"];
let selected="",remaining=[],qs=[],idx=0,wrong=[],roundWrong=[],classAnswered=0,classCorrect=0,isRetry=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderClasses(){classes.innerHTML="";classOrder.forEach(c=>{let n=questions.filter(x=>x.c===c).length,b=document.createElement("button");b.innerHTML='<span class="subject">'+c+'</span><br><span class="muted">'+(n?n+" questão"+(n>1?"ões":"")+" disponível"+(n>1?"is":""):"Questões em preparação")+"</span>";if(n)b.onclick=()=>chooseClass(c);else{b.disabled=true;b.classList.add("disabled")}classes.appendChild(b)});let b=document.createElement("button");b.className="primary";b.textContent="Simulado Geral — todas as matérias";b.onclick=()=>chooseClass("Simulado Geral");classes.appendChild(b)}
function chooseClass(c){selected=c;let pool=c==="Simulado Geral"?questions:questions.filter(x=>x.c===c);remaining=shuffle(pool);classAnswered=0;classCorrect=0;startRound()}
function startRound(){isRetry=false;wrong=[];qs=remaining.splice(0,15);idx=0;home.style.display="none";result.style.display="none";quiz.style.display="block";show()}
function show(){let x=qs[idx];subject.textContent=selected;count.textContent="Questão "+(idx+1)+" de "+qs.length;bar.style.width=(idx/qs.length*100)+"%";question.textContent=x.q;options.innerHTML="";x.o.forEach((v,n)=>{let b=document.createElement("button");b.textContent=String.fromCharCode(65+n)+") "+v;b.onclick=()=>answer(n,b);options.appendChild(b)})}
function answer(n,b){[...options.children].forEach(x=>x.disabled=true);let x=qs[idx],hit=n===x.a;if(hit)b.classList.add("ok");else{b.classList.add("bad");options.children[x.a].classList.add("ok");wrong.push(x)}if(!isRetry){classAnswered++;if(hit)classCorrect++}setTimeout(()=>{idx++;idx<qs.length?show():finish()},650)}
function finish(){quiz.style.display="none";result.style.display="block";resultSubject.textContent=selected;let hits=qs.length-wrong.length;score.innerHTML="<strong>"+hits+" acerto"+(hits!==1?"s":"")+"</strong> de "+qs.length+" — "+Math.round(hits/qs.length*100)+"%";overall.innerHTML="<strong>Desempenho nesta matéria:</strong> "+classCorrect+" acerto"+(classCorrect!==1?"s":"")+" em "+classAnswered+" questão"+(classAnswered!==1?"ões":"")+" respondida"+(classAnswered!==1?"s":"")+". "+(remaining.length?remaining.length+" questão"+(remaining.length!==1?"ões":"")+" ainda não respondida"+(remaining.length!==1?"s":"")+".":"Você concluiu todas as questões disponíveis desta matéria.");retry.style.display=wrong.length?"block":"none";roundWrong=[...wrong];next.style.display=(!isRetry&&remaining.length)?"block":"none";next.textContent="Próximas "+Math.min(15,remaining.length)+" pergunta"+(Math.min(15,remaining.length)!==1?"s":"")}
function retryWrong(){qs=[...roundWrong];idx=0;wrong=[];isRetry=true;result.style.display="none";quiz.style.display="block";show()}
function nextRound(){startRound()}
function goHome(){quiz.style.display="none";result.style.display="none";home.style.display="block";renderClasses()}
renderClasses();
</script></body></html>
